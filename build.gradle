plugins {
    id("idea")
    id("eclipse")
    id("maven-publish")
    id("net.kyori.blossom") version "2.2.0" // https://github.com/KyoriPowered/blossom
    // fabric: replaces ModDevGradle. "fabric-loom" is the remapping variant, needed while MC is obfuscated (<= 1.21.11)
    id("fabric-loom") version "1.18.2" // https://fabricmc.net/develop/
}

boolean dev = System.getenv("RELEASE") == null || System.getenv("RELEASE") == "false"
String buildNumber = System.getenv("BUILD_NUMBER")
String gitHash = calculateGitHash() + (hasUnstaged() ? "-modified" : "")

group = "com.simibubi.create"
version = mod_version + "+fabric" + (dev && buildNumber != null ? "-${buildNumber}" : "")

base {
    archivesName = "$mod_id-fabric-$minecraft_version"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

println("Java: ${System.getProperty("java.version")}, JVM: ${System.getProperty("java.vm.version")} (${System.getProperty("java.vendor")}), Arch: ${System.getProperty("os.arch")}")

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/create.accesswidener")

    runs {
        configureEach {
            vmArg("-XX:+IgnoreUnrecognizedVMOptions")
            vmArg("-XX:+AllowEnhancedClassRedefinition")
            //vmArg("-XX:-OmitStackTraceInFastThrow") // uncomment when you get exceptions with null messages etc

            property("mixin.debug.verbose", "true")
            property("mixin.debug.export", "true")
            property("log4j.configurationFile", file("log4j.xml").absolutePath)
        }

        client {
            client()
        }

        server {
            server()
            runDir("run/server")
            programArg("--nogui")
        }

        gameTestServer {
            server()
            name("Game Test Server")
            runDir("run/gametest")
            vmArg("-Dfabric-api.gametest")
            vmArg("-Dfabric-api.gametest.report-file=${layout.buildDirectory.file("junit.xml").get().asFile}")
            ideConfigGenerated(false)
        }
    }
}

repositories {
    maven { url = "https://maven.parchmentmc.org" } // Parchment
    maven { url = "https://maven.createmod.net" } // Ponder, Flywheel
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" } // Forge Config API Port
    maven { url = "https://maven.blamejared.com" } // JEI
    maven { url = "https://maven.squiddev.cc" } // CC: Tweaked
    maven { url = "https://maven.terraformersmc.com/releases" } // Mod Menu
    maven { url = "https://maven.ftb.dev/releases" } // FTB Mods
    maven { url = "https://maven.architectury.dev" } // Arch API
    maven { url = "https://chocolateminecraft.com/maven" } // Xaero
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup("maven.modrinth") }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:$minecraft_version")
    mappings(loom.layered {
        officialMojangMappings()
        if (parchment_version != "none") {
            String parchmentMc = parchment_minecraft_version == "same" ? minecraft_version : parchment_minecraft_version
            parchment("org.parchmentmc.data:parchment-$parchmentMc:$parchment_version@zip")
        }
    })

    modImplementation("net.fabricmc:fabric-loader:$fabric_loader_version")
    modImplementation("net.fabricmc.fabric-api:fabric-api:$fabric_api_version")

    // Required dependencies
    compileOnly("com.google.code.findbugs:jsr305:3.0.2") // fabric: javax.annotation, previously provided by NeoForge
    // Registrate is compiled from registrate/ as part of the main source set; it needs Lombok
    compileOnly("org.projectlombok:lombok:1.18.48")
    annotationProcessor("org.projectlombok:lombok:1.18.48")

    modCompileOnlyApi("dev.engine-room.flywheel:flywheel-fabric-api-$minecraft_version:$flywheel_version")
    modRuntimeOnly(include("dev.engine-room.flywheel:flywheel-fabric-$minecraft_version:$flywheel_version"))

    modApi(include("net.createmod.ponder:ponder-fabric:$ponder_version+mc$minecraft_version"))
    modApi(include("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$forge_config_api_port_version"))

    // Local dependencies - not published to consumers
    modLocalRuntime("dev.engine-room.vanillin:vanillin-fabric-$minecraft_version:$vanillin_version")
    modLocalRuntime("com.terraformersmc:modmenu:$modmenu_version")

    // Compat - compile only for now; loaded at runtime once each integration is ported (PORTING.md D5)
    modCompileOnly("com.terraformersmc:modmenu:$modmenu_version")
    modCompileOnly("mezz.jei:jei-$minecraft_version-fabric:$jei_version")
    modCompileOnly("maven.modrinth:sodium:mc$minecraft_version-$sodium_version-fabric")

    if (cc_tweaked_enable.toBoolean()) {
        modCompileOnly("cc.tweaked:cc-tweaked-$minecraft_version-core-api:$cc_tweaked_version")
        modCompileOnly("cc.tweaked:cc-tweaked-$minecraft_version-fabric-api:$cc_tweaked_version")
    }

    modCompileOnly("maven.modrinth:farmers-delight-refabricated:$farmers_delight_version")

    modCompileOnly("dev.architectury:architectury-fabric:13.0.6") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-chunks-fabric:2101.1.22") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-teams-fabric:2101.1.11") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-library-fabric:2101.1.37") { transitive = false }

    modCompileOnly("maven.modrinth:journeymap:1.21.1-6.0.9+fabric") { transitive = false }

    modCompileOnly("xaero.lib:xaerolib-fabric-1.21:1.0.42") { transitive = false }
    modCompileOnly("maven.modrinth:xaeros-world-map:fabric-1.21.1-1.40.16") { transitive = false }
}

sourceSets.main {
    java {
        srcDir("registrate/src/main/java")
        srcDir("neoforge-shim/src/main/java")

        if (!cc_tweaked_enable.toBoolean()) {
            exclude("com/simibubi/create/compat/computercraft/implementation/**")
        }

        // fabric: integrations with NeoForge-only mods. Their call sites are removed with // fabric: comments
        exclude("com/simibubi/create/compat/curios/**")
        exclude("com/simibubi/create/compat/dynamictrees/**")
        exclude("com/simibubi/create/compat/framedblocks/**")
        exclude("com/simibubi/create/compat/inventorySorter/**")
        exclude("com/simibubi/create/compat/tconstruct/**")
        exclude("com/simibubi/create/compat/thresholdSwitch/**")
    }

    resources {
        srcDir("src/generated/resources")
        exclude(".cache/")
        exclude("data/create/.wiki")
        // fabric: NeoForge-only data; contents are registered in code (scripts/fabric/convert_generated_resources.py)
        exclude("data/neoforge/")
        exclude("data/create/neoforge/")
        exclude("META-INF/accesstransformer.cfg") // kept for upstream merges; scripts/fabric/at_to_aw.py turns it into create.accesswidener
    }

    blossom.javaSources {
        property("version", mod_version)
        property("gitCommit", gitHash.toString())
    }
}

jar {
    from("LICENSE.md") {
        rename { "${mod_name}_${it}" }
    }
    from("registrate/LICENSE") {
        rename { "Registrate_LICENSE" }
    }
    from("neoforge-shim/LICENSE.txt") {
        rename { "NeoForge-shim_LICENSE.txt" }
    }
}

tasks.withType(Jar).configureEach {
    manifest.attributes([
        "Git-Hash": gitHash
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs.addAll(["-Xmaxerrs", "10000"])
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        "mod_version"          : version,
        "mod_id"               : mod_id,
        "mod_name"             : mod_name,
        "mod_author"           : mod_author,
        "mod_description"      : mod_description,
        "mod_license"          : mod_license,
        "fabric_loader_version": fabric_loader_version,
        "fabric_api_version"   : fabric_api_version,
        "minecraft_version"    : minecraft_version,
        "ponder_version"       : ponder_version,
    ]
    inputs.properties(replaceProperties)
    expand(replaceProperties)
    from("src/main/templates")
    into("build/generated/sources/modMetadata")
}

sourceSets.main.resources.srcDir(generateModMetadata)

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from(components.java)
        }
    }
}

String calculateGitHash() {
    try {
        ExecOutput output = providers.exec {
            commandLine("git", "rev-parse", "HEAD")
        }
        return output.standardOutput.asText.get().trim()
    } catch (Throwable ignored) {
        return "unknown"
    }
}

boolean hasUnstaged() {
    try {
        ExecOutput output = providers.exec {
            commandLine("git", "status", "--porcelain")
        }
        String result = output.standardOutput.asText.get().replace("/M gradlew(\\.bat)?/", "").trim()
        return !result.isEmpty()
    } catch (Throwable ignored) {
        return false
    }
}

// fabric: used by scripts/fabric/javac_check.sh, which runs javac outside Gradle while the port has
// thousands of compile errors (Gradle runs out of heap relaying that much compiler output)
tasks.register("writeCompileClasspath") {
    dependsOn("generateJavaTemplates")
    var out = layout.buildDirectory.dir("javac-check")
    var classpath = sourceSets.main.compileClasspath
    var processors = sourceSets.main.annotationProcessorPath
    var sources = sourceSets.main.java.srcDirs
    outputs.dir(out)
    doLast {
        var dir = out.get().asFile
        dir.mkdirs()
        new File(dir, "classpath.txt").text = classpath.files.join(File.pathSeparator)
        new File(dir, "processorpath.txt").text = processors.files.join(File.pathSeparator)
        new File(dir, "sourcedirs.txt").text = sources.findAll { it.exists() }.join("\n")
    }
}
